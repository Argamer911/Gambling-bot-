<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#080b12">
  <title>AR 3D Shinobi Fight</title>
  <link rel="stylesheet" href="./style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="game-root">
    <div class="top-hud">
      <div class="brand">AR <span>SHINOBI FIGHT</span></div>
      <div class="bars">
        <div class="fighter"><b>MASKED SHINOBI</b><div class="bar"><i id="player-health"></i></div></div>
        <div class="fighter enemy"><b>RIVAL</b><div class="bar"><i id="enemy-health"></i></div></div>
      </div>
      <div class="status"><span id="health-label">HP 100</span><span id="chakra-label">CHAKRA 100</span></div>
    </div>
    <div id="loading">BUILDING THE BATTLEFIELD...</div>
    <div id="message" aria-live="polite">READY TO FIGHT</div>
    <div class="bottom-hud">
      <div class="move-zone"><div id="joystick"><div id="stick"></div></div><small>MOVE</small></div>
      <div class="actions">
        <button data-action="block" class="small">BLOCK</button>
        <button data-action="jump" class="small">JUMP</button>
        <button data-action="attack" class="attack">ATTACK</button>
        <button data-action="kamui" class="skill">KAMUI</button>
        <button data-action="fire" class="skill">FIRE</button>
      </div>
    </div>
    <div class="hint">Move with joystick · Tap skills to attack</div>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
